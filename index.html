<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C93A22">
<meta name="description" content="Common Good 點單、結帳與營收系統">
<meta name="robots" content="noindex">
<title>Common Good 點酒單</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Common Good">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Noto+Serif+TC:wght@400;600;700&display=swap">
<style>
/* Layout: leather-red masthead + guest chips, cream menu cards grouped by menu page, sticky tab bar; bottom tally bar opens the order sheet */
:root{
  --leather:#C93A22; --leather-deep:#A22C18; --on-leather:#F6EBDD;
  --paper:#F5F0E6; --card:#FFFCF6; --ink:#2B211B; --muted:#7A6A5C; --line:#E2D7C6;
  --gold:#9A6A2C; --chip:#EFE5D4;
  --f-display:"Marcellus SC","Cormorant SC",Georgia,serif;
  --f-body:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --leather:#B8371F; --leather-deep:#8E2A16; --on-leather:#F6EBDD;
  --paper:#1C1512; --card:#271E19; --ink:#F1E6D6; --muted:#B3A08D; --line:#3D3029;
  --gold:#D7A35E; --chip:#33271F; color-scheme:dark}}
:root[data-theme="dark"]{
  --leather:#B8371F; --leather-deep:#8E2A16; --on-leather:#F6EBDD;
  --paper:#1C1512; --card:#271E19; --ink:#F1E6D6; --muted:#B3A08D; --line:#3D3029;
  --gold:#D7A35E; --chip:#33271F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.55;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--leather)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* masthead */
.mast{background:var(--leather);color:var(--on-leather)}
.mast .wrap{padding-block:22px 16px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:14px}
.mono{width:52px;height:60px;border:1.5px solid currentColor;border-radius:26px 26px 3px 3px;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;letter-spacing:-2px;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.06em;line-height:1.1}
.brand p{margin:2px 0 0;font-size:12px;letter-spacing:.12em;opacity:.85}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font-size:12px;letter-spacing:.1em;opacity:.8}
.table-in{width:64px;padding:5px 8px;border-radius:6px;border:1px solid rgba(246,235,221,.5);background:var(--leather-deep);color:var(--on-leather);font:inherit;text-align:center}
.guests{display:flex;gap:6px;flex-wrap:wrap}
.g{border:1px solid rgba(246,235,221,.55);background:transparent;border-radius:999px;padding:4px 12px;font-size:14px;color:var(--on-leather)}
.g[aria-pressed="true"]{background:var(--on-leather);color:var(--leather-deep);font-weight:700}
.g.add{border-style:dashed}
.hint{font-size:12px;opacity:.85;margin:0}
.brand p.sync{margin-top:6px;display:inline-block;font-size:11px;letter-spacing:.06em;padding:1px 8px;border-radius:999px;background:var(--leather-deep);opacity:1}
.brand p.sync.warn{background:var(--on-leather);color:var(--leather-deep);font-weight:700}
#seats{display:flex;flex-direction:column;gap:8px}
.zone{display:flex;gap:8px;align-items:center}
.zone>span{flex:none;width:44px;font-size:11px;letter-spacing:.08em;opacity:.8}
.zone .seatrow{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.seat{position:relative;min-width:46px;height:40px;padding:0 8px;border:1px solid rgba(246,235,221,.55);background:transparent;color:var(--on-leather);border-radius:6px;font-family:var(--f-display);font-size:16px;letter-spacing:.04em}
.seat.has{background:var(--leather-deep);border-color:var(--on-leather)}
.seat[aria-pressed="true"]{background:var(--on-leather);color:var(--leather-deep);border-color:var(--on-leather);font-weight:700}
.seat b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--ink);color:var(--paper);font:700 11px/18px var(--f-body);text-align:center}
.nudge{background:var(--chip);border-left:3px solid var(--leather);padding:8px 12px;font-size:14px;margin-top:14px}
.seat-tag{display:inline-block;font-family:var(--f-display);background:var(--leather);color:var(--on-leather);border-radius:4px;padding:0 7px;margin-right:6px}
.person.cur h4{color:var(--leather)}
.mini{border:1px solid var(--line);background:transparent;border-radius:6px;font-size:12px;padding:2px 8px;color:var(--muted)}
.mini.go{border-color:var(--leather);color:var(--leather);font-weight:700}
.modes{display:flex;gap:4px;background:var(--chip);border-radius:10px;padding:4px}
.modes button{flex:1;border:0;background:transparent;border-radius:7px;padding:8px 4px;font-size:14px}
.modes button[aria-pressed="true"]{background:var(--card);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{min-width:46px;height:36px;padding:0 8px;border:1px solid var(--line);background:var(--card);border-radius:6px;font-family:var(--f-display);font-size:15px}
.pick button[aria-pressed="true"]{background:var(--leather);color:var(--on-leather);border-color:var(--leather)}
.pick button small{font-family:var(--f-body);font-size:11px;opacity:.75;margin-left:4px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.cash{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cash input{width:120px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.change{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.warn{color:var(--leather)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.switch input{width:20px;height:20px;accent-color:var(--leather)}
.bill{border-bottom:1px dashed var(--line);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.bill .m{color:var(--muted);font-size:12px}
.bill .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}
.bar .wrap .btns{display:flex;gap:8px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* menu */
section{padding-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--gold);padding-bottom:6px;margin-bottom:4px}
.sec-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--gold);letter-spacing:.04em}
.sec-h span{font-size:12px;color:var(--muted)}
.sec-sub{font-size:13px;color:var(--muted);margin:6px 0 4px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.item .nm{min-width:0}
.en{font-family:var(--f-display);font-size:18px;line-height:1.2;color:var(--gold)}
.zh{font-weight:700;font-size:15px}
.stage{font-size:11px;letter-spacing:.08em;color:var(--leather);border:1px solid var(--leather);border-radius:3px;padding:0 5px;margin-right:6px;vertical-align:2px}
.ing{font-size:13px;color:var(--muted);margin-top:3px}
.note{font-size:13px;margin-top:3px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.price{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.step button{width:34px;height:34px;border:0;background:transparent;font-size:18px;border-radius:999px}
.step button:disabled{opacity:.3;cursor:default}
.step .q{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.addbtn{border:0;background:var(--leather);color:var(--on-leather);border-radius:999px;height:34px;padding:0 16px;font-size:14px}
.who{font-size:11px;color:var(--muted);text-align:right;max-width:120px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--ink);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.bar .sum{flex:1;min-width:0}
.bar .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.bar small{display:block;font-size:12px;opacity:.75}
.primary{border:0;background:var(--leather);color:var(--on-leather);border-radius:8px;padding:11px 18px;font-weight:700}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px}
.bar .ghost{background:transparent;color:var(--paper);border-color:rgba(255,255,255,.3)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,5,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:16px 16px 0 0;max-height:88%;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{padding-block:18px;display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--gold)}
.person h4{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:4px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.line .p{font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;width:28px;height:28px}
.totals{border-top:2px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between}
.totals .t{font-size:20px;font-weight:700}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.confirm{background:var(--chip);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:30}
.empty{color:var(--muted);font-size:14px}
textarea{width:100%;min-height:150px;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.newguest{display:flex;gap:6px}
.newguest input{width:110px;padding:4px 10px;border-radius:999px;border:1px solid rgba(246,235,221,.6);background:var(--leather-deep);color:var(--on-leather);font:inherit;font-size:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-size:14px;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.login{position:fixed;inset:0;z-index:50;background:var(--leather);color:var(--on-leather);display:grid;place-items:center;overflow:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.login-card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px}
.login-card .mono{margin-bottom:6px}
.login-card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;letter-spacing:.06em}
.login-card .sub{margin:0 0 14px;font-size:13px;letter-spacing:.1em;opacity:.85}
.login-card label{font-size:12px;letter-spacing:.1em;opacity:.85;margin-top:6px}
.login-card input{padding:12px 14px;border-radius:8px;border:1px solid rgba(246,235,221,.5);background:var(--leather-deep);color:var(--on-leather);font:inherit;font-size:16px}
.login-card input::placeholder{color:rgba(246,235,221,.5)}
.login-card .primary{margin-top:14px;background:var(--on-leather);color:var(--leather-deep);padding:13px;font-size:16px}
.login-card .err{min-height:1.4em;margin:4px 0 0;font-size:14px;font-weight:700}
.cbox{padding-top:18px}
.cform{display:flex;gap:8px;padding:12px 0 6px;flex-wrap:wrap;align-items:center}
.cform input{flex:1 1 150px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.cform #cPrice{flex:0 1 110px;font-variant-numeric:tabular-nums}
.chint{font-size:12px;color:var(--muted);margin:0 0 4px}
.seg{background:var(--chip);padding:4px;border-radius:10px;gap:4px}
.seg button{flex:1;border:0;background:transparent;font-family:var(--f-body)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:700;border:0}
.rnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rnav b{font-size:17px;min-width:0}
.rnav .mini{min-width:34px;height:32px;font-size:16px}
.rnav .mini[data-now]{font-size:12px;min-width:0}
.rnav input[type=date]{margin-left:auto;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.meter{display:inline-block;vertical-align:middle;width:64px;height:6px;border-radius:3px;background:var(--chip);margin-left:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);border-radius:3px}
.pct{font-size:12px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.rank{display:inline-block;min-width:22px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.dayrow{display:grid;grid-template-columns:96px 1fr auto 84px;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:7px 0;text-align:left;font-size:14px}
.dayrow .meter{width:100%;margin:0}
.dayrow .amt{text-align:right;font-weight:700}
.dayrow:disabled{color:var(--muted);cursor:default}
.dayrow:disabled .meter{visibility:hidden}
.ed-sec{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.ed-sec.off{opacity:.6}
.ed-row{display:flex;gap:6px;flex-wrap:wrap}
.ed-row input,.ed-fields input{flex:1 1 140px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
.ed-row input[data-sf="zh"]{font-weight:700}
.ed-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ed-tools em,.ed-sum em{font-style:normal;font-size:11px;color:var(--leather);border:1px solid var(--leather);border-radius:3px;padding:0 4px}
.ed-tools .mini:disabled{opacity:.35}
.ed-item{border-top:1px dashed var(--line)}
.ed-item.off .ed-nm{opacity:.55}
.ed-sum{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:transparent;padding:9px 2px;text-align:left;font-size:14px}
.ed-sum .ed-nm{min-width:0}
.ed-sum .ed-nm span{color:var(--muted)}
.ed-sum .p{font-weight:700;font-variant-numeric:tabular-nums}
.ed-item.open{background:var(--paper);border-radius:8px;padding:0 8px 10px;margin:4px -4px}
.ed-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.ed-fields label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.ed-fields label input{flex:none;width:100%}
.ed-fields .ed-tools{grid-column:1/-1}
@media (max-width:420px){.dayrow{grid-template-columns:84px 1fr 72px}.dayrow>span:nth-child(3){display:none}}
</style>
</head>
<body>


<header class="mast">
  <div class="wrap">
    <div class="brand">
      <div class="mono" aria-hidden="true">CG</div>
      <div><h1>Common Good</h1><p>BAR &amp; RESTAURANT · ESTD 2016</p><p id="sync" class="sync">連線中…</p></div>
    </div>
    <div class="row" style="justify-content:space-between">
      <span class="lbl" id="seatLbl">先選位子，再點酒</span>
      <span class="row" style="gap:6px"><button id="randomBtn" class="g">🎲 亂數選一杯</button><button id="adminBtn" class="g" hidden>⚙ 酒單</button><button id="logout" class="g" hidden>登出</button></span>
    </div>
    <div id="seats"></div>
  </div>
</header>

<nav class="tabs" aria-label="酒單分類"><div class="wrap" id="tabs"></div></nav>
<div class="wrap"><section id="sec-custom" class="cbox" style="scroll-margin-top:56px">
  <div class="sec-h"><h2>Custom</h2><span>自訂品項</span></div>
  <form id="cForm" class="cform">
    <input id="cName" maxlength="20" placeholder="品名，例如 生啤酒" autocomplete="off" aria-label="自訂品名">
    <input id="cPrice" inputmode="numeric" maxlength="6" placeholder="金額" autocomplete="off" aria-label="自訂金額">
    <button class="addbtn" type="submit">加入</button>
  </form>
  <p class="chint">菜單上沒有的品項，自己輸入名稱和金額，加到目前選的位子。</p>
  <div id="cList"></div>
</section></div>
<main class="wrap" id="menu"></main>

<div class="bar"><div class="wrap">
  <div class="sum"><div class="big" id="barTotal">NT$0</div><small id="barCount">還沒點酒</small></div>
  <div class="btns"><button class="ghost" id="openSheet">點單</button><button class="primary" id="openPay">結帳</button></div>
</div></div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="點單"><div class="wrap" id="sheetBody"></div></div>
<div class="toast" id="toast" hidden></div>

<div id="login" class="login">
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="mono" aria-hidden="true">CG</div>
    <h2>Common Good</h2>
    <p class="sub">點單系統 · 平板登入</p>
    <label for="email">帳號</label>
    <input id="email" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="例如 bar" required>
    <label for="pw">密碼</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="primary" id="loginBtn" type="submit">登入</button>
    <p id="loginErr" class="err" role="alert"></p>
  </form>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, addDoc, deleteDoc, setDoc, onSnapshot, query, where, orderBy, writeBatch, runTransaction, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const hm=t=>{const d=new Date(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const monthOf=k=>k.slice(0,7);
const addMonths=(mk,n)=>{const [y,m]=parts(mk);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};

function fail(e){
  console.error(e);
  if(e&&e.code==="permission-denied")toast("這個帳號沒有權限做這件事");
  else if(e&&e.code==="resource-exhausted")toast("雲端用量已滿，請稍後再試");
  else toast("儲存失敗，請再試一次");
}
function guard(){if(!ready){toast("請先登入");return false}return true}
async function batchRun(refs,fn){
  for(let i=0;i<refs.length;i+=450){const b=writeBatch(db);refs.slice(i,i+450).forEach(r=>fn(b,r));await b.commit()}
}
const store={
  addCup:(i,s)=>{if(!guard())return;addDoc(collection(db,"cups"),cupData(i,s,Date.now())).catch(fail)},
  removeCup:(i,s)=>{if(!guard())return;const last=cups.filter(c=>vid(c)===i&&c.s===s).sort((a,b)=>b.t-a.t)[0];
    if(last)deleteDoc(doc(db,"cups",last.id)).catch(fail)},
  delCups:async ids=>{if(!guard())return false;
    batchRun(ids.map(id=>doc(db,"cups",id)),(b,r)=>b.delete(r)).catch(fail);return true},
  setSvc:v=>{if(!guard())return;setDoc(doc(db,"settings","main"),{svc:v}).catch(fail)},
};
async function checkout(bill,ids){
  if(!guard())return false;
  if(!navigator.onLine){toast("網路斷線中，連上後再結帳");return false}
  try{
    await runTransaction(db,async tx=>{
      const refs=ids.map(id=>doc(db,"cups",id));
      const snaps=[];for(const r of refs)snaps.push(await tx.get(r));
      if(snaps.some(s=>!s.exists()))throw {code:"changed"};
      tx.set(doc(collection(db,"bills")),bill);
      refs.forEach(r=>tx.delete(r));
    });
    return true;
  }catch(e){
    if(e&&e.code==="changed")toast("這桌剛被其他平板改過或已結帳，請重新確認");
    else if(e&&e.code==="unavailable")toast("網路不穩，請再按一次結帳");
    else fail(e);
    return false;
  }
}
async function voidBill(b){
  if(!guard())return false;
  const back=[];b.lines.forEach(l=>{const id=l.i||Object.keys(ITEMS).find(k=>ITEMS[k].en===l.en);if(!id)return;if(id.startsWith("cx:"))regCustom(id,l.en,l.price);for(let n=0;n<l.q;n++)back.push(cupData(id,l.s,Date.now()+n))});
  try{const bt=writeBatch(db);bt.update(doc(db,"bills",b.id),{void:true});back.forEach(c=>bt.set(doc(collection(db,"cups")),c));await bt.commit();return true}
  catch(e){fail(e);return false}
}
function listen(){
  unsubs.forEach(u=>u());unsubs=[];
  const onErr=e=>{console.error(e);if(e.code==="permission-denied")toast("沒有讀取權限，請檢查資料庫規則")};
  /* 即時同步最近 3 個營業日的帳單；更早的帳在「營收」查詢時才讀取 */
  LIVE_START=bdayStart(addDays(bday(Date.now()),-2));
  unsubs.push(onSnapshot(collection(db,"cups"),s=>{cups=s.docs.map(d=>({id:d.id,...d.data()}));rebuild()},onErr));
  unsubs.push(onSnapshot(query(collection(db,"bills"),where("time",">=",LIVE_START),orderBy("time","desc")),s=>{bills=s.docs.map(d=>({id:d.id,...d.data()}));rebuild()},onErr));
  unsubs.push(onSnapshot(doc(db,"settings","main"),s=>{svcSetting=s.exists()?s.data().svc!==false:true;rebuild()},onErr));
  unsubs.push(onSnapshot(doc(db,"settings","menu"),s=>applyMenu(s.exists()?s.data():null),onErr));
}

function calc(){
  const per={};SEATS.forEach(s=>per[s]={lines:[],sub:0,cnt:0});let cnt=0,sub=0;
  for(const k in st.lines){const [id,s]=k.split("|");const it=ITEMS[id];const q=st.lines[k];if(!it||!per[s])continue;
    per[s].lines.push({it,q,k,s});per[s].sub+=it.price*q;per[s].cnt+=q;cnt+=q;sub+=it.price*q;}
  return{per,cnt,sub};
}
function orderText(c,only){
  let t=`Common Good 點單${only?` · ${only}`:""}\n`;let tot=0,cnt=0;
  SEATS.forEach(s=>{if(only&&s!==only)return;const p=c.per[s];if(!p.lines.length)return;t+=`\n【${s}】\n`;
    p.lines.forEach(l=>{t+=`  ${l.it.en}（${l.it.zh}）x${l.q}  ${l.it.price*l.q}\n`;cnt+=l.q});
    t+=`  小計 ${p.sub}\n`;tot+=p.sub;});
  t+=`\n共 ${cnt} 杯 · 小計 ${tot}`;return t;
}

const rep={kind:"day",day:bday(Date.now()),month:monthOf(bday(Date.now()))};
let repCache={};const repLoading=new Set();
function repRange(){
  if(rep.kind==="day")return{a:bdayStart(rep.day),b:bdayStart(addDays(rep.day,1)),label:bdayLabel(rep.day),tag:rep.day};
  const [y,m]=parts(rep.month);
  return{a:new Date(y,m-1,1,CUTOFF).getTime(),b:new Date(y,m,1,CUTOFF).getTime(),label:`${y} 年 ${m} 月`,tag:rep.month};
}
async function fetchRange(key,a,b){
  repLoading.add(key);
  try{const s=await getDocs(query(collection(db,"bills"),where("time",">=",a),where("time","<",b),orderBy("time")));
    repCache[key]=s.docs.map(d=>({id:d.id,...d.data()}))}
  catch(e){console.error(e);repCache[key]=false}
  repLoading.delete(key);renderSheet();
}
/* 回傳區間內的帳單（含作廢）；讀取中回傳 null，失敗回傳 false */
function repBills(){
  const {a,b}=repRange();
  const la=Math.max(a,LIVE_START);
  const live=la<b?st.bills.filter(x=>x.time>=la&&x.time<b):[];
  if(!ready||a>=LIVE_START)return live;
  const ob=Math.min(b,LIVE_START),key=a+"-"+ob;
  if(!(key in repCache)){if(!repLoading.has(key))fetchRange(key,a,ob);return null}
  if(repCache[key]===false)return false;
  return repCache[key].concat(live);
}
function repData(all){
  const {a,b}=repRange();
  const bs=all.filter(x=>!x.void).sort((x,y)=>x.time-y.time);
  const voided=all.length-bs.length;
  const sum=f=>bs.reduce((x,b)=>x+(f(b)||0),0);
  const items={},seats={},byM={},days={};
  bs.forEach(b=>{
    b.lines.forEach(l=>{const k=l.en+"|"+l.zh;const it=items[k]||(items[k]={en:l.en,zh:l.zh,q:0,amt:0});it.q+=l.q;it.amt+=l.price*l.q;seats[l.s]=(seats[l.s]||0)+l.price*l.q});
    const m=byM[b.method]||(byM[b.method]={n:0,amt:0});m.n++;m.amt+=b.total;
    const dk=bday(b.time);const d=days[dk]||(days[dk]={n:0,cups:0,sub:0,svc:0,total:0});d.n++;d.cups+=b.cnt;d.sub+=b.sub;d.svc+=b.svc;d.total+=b.total;
  });
  const dayList=[];const last=Math.min(b,bdayStart(addDays(bday(Date.now()),1)));
  for(let k=bday(a);bdayStart(k)<last;k=addDays(k,1))dayList.push({k,...(days[k]||{n:0,cups:0,sub:0,svc:0,total:0})});
  const total=sum(b=>b.total);
  return{bs,voided,total,sub:sum(b=>b.sub),svc:sum(b=>b.svc),cups:sum(b=>b.cnt),
    items:Object.values(items).sort((a,b)=>b.q-a.q||b.amt-a.amt),seats,byM,dayList,openDays:dayList.filter(d=>d.n).length,
    tr:bs.filter(b=>b.method==="轉帳")};
}

  const rank=[["排名","品名","中文","數量","金額"],...r.items.map((i,n)=>[n+1,i.en,i.zh,i.q,i.amt])];
  const lineRows=[["營業日","時間","位子","品名","中文","單價","數量","小計","付款方式"]];
  r.bs.forEach(b=>b.lines.forEach(l=>lineRows.push([bday(b.time),hm(b.time),l.s,l.en,l.zh,l.price,l.q,l.price*l.q,b.method])));
  if(btn){btn.disabled=true;btn.textContent="匯出中…"}
  try{
    const X=await loadXlsx();const wb=X.utils.book_new();
    const add=(rows,name,cols)=>{const ws=X.utils.aoa_to_sheet(rows);ws["!cols"]=cols.map(w=>({wch:w}));X.utils.book_append_sheet(wb,ws,name)};
    add(summary,"摘要",[18,16,12,10]);add(daily,"每日營收",[12,6,8,8,10,10,10]);add(billRows,"帳單",[12,7,8,8,10,8,6,8,8,8,40]);
    add(rank,"銷量排行",[6,28,18,8,10]);add(lineRows,"品項明細",[12,7,6,28,18,8,6,8,8]);
    const out=X.write(wb,{bookType:"xlsx",type:"array"});saveBlob(new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),`CommonGood_Revenue_${tag}.xlsx`);toast("已下載 Excel");
  }catch(e){
    console.error(e);
    const csv="﻿"+billRows.map(row=>row.map(c=>{c=String(c??"");return /[",\r\n]/.test(c)?`"${c.replace(/"/g,'""')}"`:c}).join(",")).join("\r\n");
    saveBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}),`CommonGood_Bills_${tag}.csv`);
    toast("Excel 元件載入失敗，已改下載 CSV（Excel 可直接開）");
  }
  if(btn){btn.disabled=false;btn.textContent="匯出 Excel"}
}

/* ---- 酒單管理（只有管理員帳號）---- */
let draft=null, openItem=null, menuSaving=false;
const clone=o=>JSON.parse(JSON.stringify(o));
const menuDirty=()=>!!draft&&JSON.stringify(draft)!==JSON.stringify(MENU);
function sheetMenu(){
  if(!isAdmin())return `<p class="empty">只有管理員帳號可以修改酒單。</p>`;
  if(!draft)draft=clone(MENU);
  const dirty=menuDirty();
  const F=(si,ii,f,lab,extra="")=>`<label>${lab}<input data-f="${f}" data-si="${si}" data-ii="${ii}" value="${esc(draft[si].items[ii][f])}" ${extra}></label>`;
  let h=`<p class="chint">改完按最下面的「儲存酒單」才會生效，所有平板會同步更新。改價格也會套用到還沒結帳的點單，已經結帳的帳不受影響。用不到的品項請「下架」，不會影響過去的報表。</p>`;
  draft.forEach((sec,si)=>{
    h+=`<div class="ed-sec${sec.off?" off":""}">
      <div class="ed-row"><input data-sf="zh" data-si="${si}" value="${esc(sec.zh)}" placeholder="分類中文名" aria-label="分類中文名"><input data-sf="en" data-si="${si}" value="${esc(sec.en)}" placeholder="分類英文名" aria-label="分類英文名"></div>
      <div class="ed-tools"><button class="mini" data-smv="${si}:-1" ${si===0?"disabled":""} aria-label="分類往上">↑</button><button class="mini" data-smv="${si}:1" ${si===draft.length-1?"disabled":""} aria-label="分類往下">↓</button><button class="mini" data-soff="${si}">${sec.off?"顯示這個分類":"隱藏這個分類"}</button>${sec.off?`<em>已隱藏</em>`:""}</div>
      ${sec.items.map((it,ii)=>{const open=openItem===it.id;
        return `<div class="ed-item${it.off?" off":""}${open?" open":""}">
          <button class="ed-sum" data-open="${esc(it.id)}"><span class="ed-nm"><b>${esc(it.en||"（未命名）")}</b> <span>${esc(it.zh)}</span>${it.off?" <em>已下架</em>":""}</span><span class="p">${esc(it.price)}</span></button>
          ${open?`<div class="ed-fields">${F(si,ii,"en","英文名稱")}${F(si,ii,"zh","中文名稱")}${F(si,ii,"price","價格",'inputmode="numeric"')}${F(si,ii,"note","說明")}${F(si,ii,"ing","成分")}${F(si,ii,"stage","標籤（可空白）")}
            <div class="ed-tools"><button class="mini" data-imv="${si}:${ii}:-1" ${ii===0?"disabled":""}>↑ 往上</button><button class="mini" data-imv="${si}:${ii}:1" ${ii===sec.items.length-1?"disabled":""}>↓ 往下</button><button class="mini" data-ioff="${si}:${ii}">${it.off?"重新上架":"下架"}</button><button class="mini" data-open="">收起</button></div></div>`:""}
        </div>`}).join("")}
      <button class="mini go" data-iadd="${si}">＋ 在「${esc(sec.zh||sec.en||"這個分類")}」新增品項</button>
    </div>`;
  });
  h+=`<div class="actions"><button class="ghost" id="secAdd">＋ 新增分類</button></div>
  <div class="actions"><button class="primary" id="menuSave" ${!dirty||menuSaving?'disabled style="opacity:.5"':""}>${menuSaving?"儲存中…":"儲存酒單"}</button><button class="ghost" id="menuReset" ${dirty?"":'disabled style="opacity:.5"'}>放棄修改</button></div>`;
  return h;
}
function validateMenu(m){
  for(const s of m){if(!s.zh.trim()&&!s.en.trim())return "有分類沒有名稱";
    for(const i of s.items){if(!i.en.trim()&&!i.zh.trim())return `「${s.zh||s.en}」裡有品項沒有名稱`;if(!(i.price>=0))return `「${i.zh||i.en}」的價格不對`}}
  return "";
}
async function saveMenu(){
  if(!isAdmin()||!draft)return;
  draft.forEach(s=>{s.en=s.en.trim();s.zh=s.zh.trim();s.items.forEach(i=>{["en","zh","note","ing","stage"].forEach(f=>i[f]=String(i[f]||"").trim());i.price=Math.max(0,Math.round(Number(i.price)||0))})});
  const err=validateMenu(draft);if(err){toast(err);return}
  menuSaving=true;renderSheet();
  try{await setDoc(doc(db,"settings","menu"),{sections:draft,updated:Date.now(),by:me.email||""});draft=null;openItem=null;toast("酒單已更新，所有平板會同步")}
  catch(e){fail(e)}
  menuSaving=false;renderSheet();
}

/* ---- sheet ---- */
function renderSheet(passive){
  if($("sheet").hidden)return;
  const a=document.activeElement;
  /* 正在輸入時，其他平板的更新先不重畫，避免打斷 */
  if(passive&&a&&a.tagName==="INPUT"&&a.type!=="checkbox"&&$("sheetBody").contains(a))return;
  const c=calc();
  $("sheetBody").innerHTML=head()+(mode==="order"?sheetOrder(c):mode==="pay"?sheetPay(c):mode==="rep"?sheetRep():mode==="menu"?sheetMenu():sheetHist());
  const B=$("sheetBody"),on=(sel,fn)=>B.querySelectorAll(sel).forEach(b=>b.onclick=()=>fn(b));
  $("closeSheet").onclick=closeSheet;
  on("[data-mode]",b=>{mode=b.dataset.mode;confirming=null;showText=false;renderSheet()});
  on("[data-no]",()=>{confirming=null;renderSheet()});
  const doCopy=t=>navigator.clipboard.writeText(t).then(()=>toast("已複製")).catch(()=>{showText=t;renderSheet();const x=$("txt");x.focus();x.select();toast("請長按文字複製")});
  if(mode==="order"){
    on("[data-k]",b=>{const k=b.dataset.k,i=k.lastIndexOf("|");change(k.slice(0,i),k.slice(i+1),-1)});
    on("[data-clr]",b=>{confirming=b.dataset.clr;renderSheet()});
    on("[data-copy]",b=>doCopy(orderText(c,b.dataset.copy)));
    on("[data-pay]",b=>{co={seats:[b.dataset.pay],method:co.method,cash:"",last5:""};mode="pay";renderSheet()});
    on("[data-yes]",async b=>{const t=b.dataset.yes;const ids=cups.filter(x=>t==="ALL"||x.s===t).map(x=>x.id);
      confirming=null;if(await store.delCups(ids))toast(t==="ALL"?"已全部清空":`${t} 已清空`);renderSheet()});
    if($("copy")){$("copy").onclick=()=>doCopy(orderText(c));$("clear").onclick=()=>{confirming="ALL";renderSheet()};}
  }
  if(mode==="pay"){
    on("[data-co]",b=>{const s=b.dataset.co;co.seats=co.seats.includes(s)?co.seats.filter(x=>x!==s):[...co.seats,s];co.cash="";renderSheet()});
    on("[data-meth]",b=>{co.method=b.dataset.meth;renderSheet()});
    on("[data-q]",b=>{co.cash=b.dataset.q;renderSheet()});
    if($("svc"))$("svc").onchange=e=>{store.setSvc(e.target.checked)};
    if($("cashIn")){$("cashIn").onchange=e=>{co.cash=e.target.value.replace(/\D/g,"");e.target.blur();renderSheet()};}
    if($("last5"))$("last5").oninput=e=>{const v=e.target.value.replace(/\D/g,"").slice(0,5);e.target.value=v;co.last5=v;
      const ok=okLast5(),btn=$("doPay");btn.disabled=!ok;btn.style.opacity=ok?"":".5";$("l5msg").textContent=ok?"":"請輸入 5 位數字"};
    if($("doPay"))$("doPay").onclick=async()=>{
      if(busy)return;
      if(document.activeElement)document.activeElement.blur();
      const d=payData(calc());if(!d.seats.length)return;
      if(co.method==="轉帳"&&!okLast5()){toast("請輸入轉帳後五碼");return}
      const cash=parseInt(co.cash,10);
      const ids=cups.filter(x=>d.seats.includes(x.s)).map(x=>x.id);
      const bill={time:Date.now(),seats:d.seats,lines:d.lines,cnt:d.lines.reduce((a,l)=>a+l.q,0),sub:d.sub,svc:d.svc,total:d.total,method:co.method,
        cash:co.method==="現金"&&!isNaN(cash)?cash:null,last5:co.method==="轉帳"?co.last5:null,void:false};
      busy=true;renderSheet();
      const ok=await checkout(bill,ids);busy=false;
      if(ok){const chg=bill.cash!=null?bill.cash-d.total:null;
        if(d.seats.includes(st.seat)){st.seat=null;saveSeat()}
        co={seats:[],method:co.method,cash:"",last5:""};mode="hist";
        toast(`${d.seats.join("+")} 已結帳 ${fmt(d.total)}${chg>0?`，找零 ${chg}`:""}`);}
      render();
    };
  }
  if(mode==="rep"){
    on("[data-kind]",b=>{rep.kind=b.dataset.kind;if(rep.kind==="month")rep.month=monthOf(rep.day);showText=false;renderSheet()});
    on("[data-step]",b=>{const n=Number(b.dataset.step);if(rep.kind==="day")rep.day=addDays(rep.day,n);else rep.month=addMonths(rep.month,n);showText=false;renderSheet()});
    on("[data-now]",()=>{rep.day=bday(Date.now());rep.month=monthOf(rep.day);showText=false;renderSheet()});
    on("[data-goday]",b=>{rep.kind="day";rep.day=b.dataset.goday;showText=false;renderSheet();$("sheet").scrollTop=0});
    if($("repDate"))$("repDate").onchange=e=>{const v=e.target.value;if(/^\d{4}-\d{2}-\d{2}$/.test(v)&&v<=bday(Date.now())){rep.day=v;e.target.blur();showText=false;renderSheet()}};
    if($("repRetry"))$("repRetry").onclick=()=>{for(const k in repCache)if(repCache[k]===false)delete repCache[k];renderSheet()};
    if($("copyRep"))$("copyRep").onclick=()=>{const all=repBills();if(Array.isArray(all))doCopy(repText(repData(all)))};
    if($("xlsx"))$("xlsx").onclick=e=>exportReport(e.currentTarget);
  }
  if(mode==="hist"){
    on("[data-void]",b=>{confirming="v"+b.dataset.void;renderSheet()});
    on("[data-vyes]",async b=>{const bill=st.bills.find(x=>x.id===b.dataset.vyes);confirming=null;
      if(bill&&await voidBill(bill))toast("已作廢，酒已退回點單");renderSheet()});
    if($("copyDay"))$("copyDay").onclick=()=>{const today=bday(Date.now());const tb=st.bills.filter(b=>!b.void&&bday(b.time)===today);
      let t=`Common Good 今日帳 ${bdayLabel(today)}\n`;
      tb.forEach(b=>t+=`${hm(b.time)} ${b.seats.join("+")} ${b.method}${b.last5?"("+b.last5+")":""} ${b.total}${b.svc?"（含服務費"+b.svc+"）":""}\n`);
      t+=`\n共 ${tb.length} 張 · 營收 ${tb.reduce((x,b)=>x+b.total,0)}`;doCopy(t)};
  }
  if(mode==="menu"&&draft){
    const sync=()=>{const d=menuDirty(),s=$("menuSave"),r=$("menuReset");if(s&&!menuSaving){s.disabled=!d;s.style.opacity=d?"":".5"}if(r){r.disabled=!d;r.style.opacity=d?"":".5"}};
    B.querySelectorAll("input[data-f]").forEach(inp=>inp.oninput=()=>{const it=draft[+inp.dataset.si].items[+inp.dataset.ii];const f=inp.dataset.f;
      if(f==="price"){const v=inp.value.replace(/\D/g,"").slice(0,6);if(v!==inp.value)inp.value=v;it.price=v===""?0:Number(v)}else it[f]=inp.value;
      const sum=inp.closest(".ed-item").querySelector(".ed-sum");if(sum&&(f==="en"||f==="zh"||f==="price")){sum.querySelector("b").textContent=it.en||"（未命名）";sum.querySelector(".ed-nm>span").textContent=it.zh;sum.querySelector(".p").textContent=it.price}
      sync()});
    B.querySelectorAll("input[data-sf]").forEach(inp=>inp.oninput=()=>{draft[+inp.dataset.si][inp.dataset.sf]=inp.value;sync()});
    on("[data-open]",b=>{openItem=b.dataset.open===openItem?null:(b.dataset.open||null);renderSheet()});
    on("[data-smv]",b=>{const [si,d]=b.dataset.smv.split(":").map(Number);const j=si+d;if(j<0||j>=draft.length)return;[draft[si],draft[j]]=[draft[j],draft[si]];renderSheet()});
    on("[data-soff]",b=>{const s=draft[+b.dataset.soff];s.off=!s.off;renderSheet()});
    on("[data-imv]",b=>{const [si,ii,d]=b.dataset.imv.split(":").map(Number);const a=draft[si].items,j=ii+d;if(j<0||j>=a.length)return;[a[ii],a[j]]=[a[j],a[ii]];renderSheet()});
    on("[data-ioff]",b=>{const [si,ii]=b.dataset.ioff.split(":").map(Number);const it=draft[si].items[ii];it.off=!it.off;renderSheet()});
    on("[data-iadd]",b=>{const it={id:uidm("m"),en:"",zh:"",price:0,ing:"",note:"",stage:"",off:false};draft[+b.dataset.iadd].items.push(it);openItem=it.id;renderSheet();
      const f=B.querySelector(`.ed-item.open input[data-f="en"]`);if(f){f.focus();f.scrollIntoView({block:"center"})}});
    if($("secAdd"))$("secAdd").onclick=()=>{const it={id:uidm("m"),en:"",zh:"",price:0,ing:"",note:"",stage:"",off:false};
      draft.push({id:uidm("s"),en:"",zh:"新分類",off:false,items:[it]});openItem=it.id;renderSheet();
      const f=B.querySelectorAll('input[data-sf="zh"]');if(f.length){const x=f[f.length-1];x.focus();x.select();x.scrollIntoView({block:"center"})}};
    if($("menuSave"))$("menuSave").onclick=saveMenu;
    if($("menuReset"))$("menuReset").onclick=()=>{draft=null;openItem=null;renderSheet();toast("已放棄修改")};
  }
}
function openSheet(m){mode=m||"order";$("sheet").hidden=false;$("scrim").hidden=false;renderSheet()}
function closeSheet(){$("sheet").hidden=true;$("scrim").hidden=true;confirming=null;showText=false}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
function render(passive){renderSeats();renderMenu();renderBar();renderSheet(passive)}

$("openSheet").onclick=()=>openSheet("order");
$("openPay").onclick=()=>{co.seats=st.seat&&seatCount(st.seat)?[st.seat]:[];co.cash="";co.last5="";openSheet("pay")};
$("adminBtn").onclick=()=>openSheet("menu");
$("scrim").onclick=()=>{if(mode==="menu"&&menuDirty()){toast("酒單還沒儲存。要離開請先按「放棄修改」或「儲存酒單」");return}closeSheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)$("scrim").onclick()});
addEventListener("beforeunload",e=>{if(menuDirty()){e.preventDefault();e.returnValue=""}});
$("cForm").addEventListener("submit",e=>{
  e.preventDefault();
  if(!st.seat)return needSeat();
  const n=$("cName").value.replace(/[|]/g,"").trim();
  const p=parseInt($("cPrice").value.replace(/\D/g,""),10);
  if(!n){toast("請輸入品名");$("cName").focus();return}
  if(!(p>0)){toast("請輸入金額");$("cPrice").focus();return}
  const id=`cx:${p}:${n}`;regCustom(id,n,p);
  store.addCup(id,st.seat);
  $("cName").value="";$("cPrice").value="";document.activeElement&&document.activeElement.blur();
  toast(`${st.seat}：${n} ${p} 元已加入`);
});
$("randomBtn").onclick=()=>{if(!st.seat)return needSeat();
  const pool=visibleSections().filter(s=>s.id!=="bar").flatMap(s=>s.items.filter(i=>!i.off));if(!pool.length)return;
  const it=pool[Math.floor(Math.random()*pool.length)];change(it.id,st.seat,1);toast(`🎲 ${st.seat}：${it.en}（${it.zh}）`);};
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(e=>console.warn(e));
renderTabs();render();setSync();
</script>
